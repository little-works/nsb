name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable

      - name: Install WebUI dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WebUI
        run: pnpm --dir gui/webui run build

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Build Windows GUI
        run: cargo build -p nsb-gui --release
