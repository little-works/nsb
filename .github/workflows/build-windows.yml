name: Build (Windows)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go tool mygo vet .
      - name: Build native desktop and installer
        shell: pwsh
        run: go tool mygo build -platform windows/amd64 .
      - uses: actions/upload-artifact@v7
        with:
          name: NSB-windows-x64
          path: dist/windows-amd64/*.exe
          if-no-files-found: error
