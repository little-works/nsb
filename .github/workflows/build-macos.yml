name: Build (macOS)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install WebUI dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WebUI
        run: pnpm --dir gui/webui run build

      - name: Build macOS GUI
        run: cargo build -p nsb-gui --release

      - name: Set up mise
        uses: jdx/mise-action@v3

      - name: Package macOS artifact
        run: mise run package-macos-app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: NSB-macos-${{ matrix.arch }}
          path: NSB-macos-${{ matrix.arch }}.zip
          archive: false
          if-no-files-found: error
