name: Build (macOS)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            arch: amd64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go tool mygo vet .
      - run: bash scripts/package-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: NSB-macos-${{ matrix.arch }}
          path: dist/NSB-macos-${{ matrix.arch }}.zip
          archive: false
          if-no-files-found: error
