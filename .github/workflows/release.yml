name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Validate release version
        shell: pwsh
        run: |
          $workspaceVersion = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          if ($tagVersion -ne $workspaceVersion) {
            throw "Tag version $tagVersion does not match workspace version $workspaceVersion."
          }

      - name: Enable pnpm
        run: corepack enable

      - name: Install WebUI dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WebUI
        run: pnpm --dir gui/webui run build

      - name: Build Windows GUI
        run: cargo build -p nsb-gui --release

      - name: Package release
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $archive = "nsb-$tag-windows-x64.zip"
          $stage = Join-Path $env:RUNNER_TEMP 'nsb-release'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item target/release/nsb.exe $stage
          Compress-Archive -Path (Join-Path $stage 'nsb.exe') -DestinationPath $archive -Force
          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -NoNewline "$archive.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" "nsb-${{ github.ref_name }}-windows-x64.zip" "nsb-${{ github.ref_name }}-windows-x64.zip.sha256" --generate-notes --title "NSB ${{ github.ref_name }}"
