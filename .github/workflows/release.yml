name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2025
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate version
        shell: pwsh
        run: |
          $version = (Get-Content mygo.json -Raw | ConvertFrom-Json).version
          if ("${{ github.ref_name }}" -ne "v$version") { throw 'Tag and mygo.json version must match' }
      - run: go test ./...
      - run: go tool mygo vet .
      - name: Package native desktop
        shell: pwsh
        run: |
          go tool mygo build -platform windows/amd64 .
          if ($LASTEXITCODE -ne 0) { throw 'MyGo build failed' }
          Get-ChildItem -LiteralPath dist/windows-amd64 -Filter '*.exe' | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -LiteralPath "$($_.FullName).sha256"
          }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -LiteralPath dist/windows-amd64 -File | Where-Object { $_.Extension -in '.exe', '.sha256' } | ForEach-Object FullName
          gh release create "${{ github.ref_name }}" @artifacts --generate-notes --title "NSB ${{ github.ref_name }}"
