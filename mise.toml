[env]
GOPROXY = "https://goproxy.cn,direct"

[tools]
go = "1.27.3"

[tasks.dev]
run = "go tool mygo dev ."

[tasks.test]
run = "go test ./..."

[tasks.vet]
run = "go tool mygo vet ."

[tasks.build-gui]
run = "go tool mygo build -platform windows/amd64 ."

[tasks.build-server]
run = "go build -o dist/nsb-server ./server/cmd/nsb-server"

[tasks.package-macos-app]
run = "bash scripts/package-macos.sh"
